<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1a5c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Safe-area background (fills full canvas for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Squircle for non-maskable contexts (subtle, same color, purely decorative) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Wallet body -->
  <g filter="url(#shadow)">
    <rect x="112" y="196" width="288" height="196" rx="28" fill="#ffffff" opacity="0.16"/>
    <rect x="100" y="176" width="312" height="216" rx="30" fill="#ffffff"/>
    <path d="M100 226 h312 v-4 a30 30 0 0 0 -30 -30 h-252 a30 30 0 0 0 -30 30 z" fill="#e6e8ff"/>
  </g>

  <!-- Wallet flap / coin pocket -->
  <rect x="292" y="252" width="108" height="72" rx="16" fill="#4338ca"/>

  <!-- Coin with euro sign -->
  <circle cx="322" cy="288" r="34" fill="url(#coin)" stroke="#4338ca" stroke-width="4"/>
  <text x="322" y="301" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#4338ca">&#8364;</text>

  <!-- Upward trend line (daily tracking motif) -->
  <path d="M140 300 L180 262 L212 284 L262 224" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M234 224 L262 224 L262 252" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
